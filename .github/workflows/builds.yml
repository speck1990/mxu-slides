name: Slides builds

on:
  push:
    branches: [main, 'windows/**', 'mac/**', 'feature/**']
    paths:
      - 'apps/windows/**'
      - 'apps/mac/**'
      - 'packages/schema/documents.json'
      - '.github/workflows/builds.yml'
      - 'script/build_and_run.sh'
      - 'LICENSE.md'
  pull_request:
    paths:
      - 'apps/windows/**'
      - 'apps/mac/**'
      - 'packages/schema/documents.json'
      - '.github/workflows/builds.yml'
      - 'script/build_and_run.sh'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Create a prerelease from this successful build'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run core regression tests
        run: dotnet run --project apps/windows/Slides.Tests/Slides.Tests.csproj --configuration Release
      - name: Publish self-contained Windows app
        run: dotnet publish apps/windows/Slides/Slides.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/Slides-win-x64 -p:PublishSingleFile=false
      - name: Check executable and required notice
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/Slides-win-x64/Slides.exe)) { throw 'Slides.exe missing' }
          if (!(Test-Path artifacts/Slides-win-x64/LICENSE.md)) { throw 'LICENSE.md missing' }
      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: Slides-win-x64
          path: artifacts/Slides-win-x64/
          if-no-files-found: error
          retention-days: 30
      - name: Package prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.prerelease
        shell: pwsh
        run: Compress-Archive -Path artifacts/Slides-win-x64/* -DestinationPath artifacts/Slides-win-x64.zip
      - name: Publish prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "windows-v0.1.0-${{ github.run_number }}" artifacts/Slides-win-x64.zip --target "${{ github.sha }}" --prerelease --title "Windows preview 0.1.0 build ${{ github.run_number }}" --notes "Personal Windows preview. See LICENSE.md for the original MxU notice and terms."
      - name: Report failure
        if: failure()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "Windows build failed. Open the failing step in this run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

  mac:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Xcode and install XcodeGen
        run: |
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Generate and build macOS app
        working-directory: apps/mac
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project MxUSlides.xcodeproj -scheme MxUSlides -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/SlidesDerivedData" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -jobs 4 build 2>&1 | tee "$RUNNER_TEMP/slides-mac-build.log" | tail -n 120
      - name: Test SongSelect payload import
        run: swift test --package-path apps/mac/Packages/PresenterCore --filter SongSelectPayloadTests
      - name: Package macOS download with license
        run: |
          app="$RUNNER_TEMP/SlidesDerivedData/Build/Products/Debug/Slides.app"
          test -f "$app/Contents/MacOS/Slides"
          lipo -archs "$app/Contents/MacOS/Slides" | grep -q arm64
          mkdir -p "$RUNNER_TEMP/Slides-mac-arm64" artifacts
          ditto "$app" "$RUNNER_TEMP/Slides-mac-arm64/Slides.app"
          cp LICENSE.md "$RUNNER_TEMP/Slides-mac-arm64/LICENSE.md"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Slides-mac-arm64" artifacts/Slides-mac-arm64.zip
      - name: Upload macOS download
        uses: actions/upload-artifact@v4
        with:
          name: Slides-mac-arm64
          path: artifacts/Slides-mac-arm64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Report failure
        if: failure()
        run: echo "macOS build failed. Check the failing step and its Xcode output in this run." >> "$GITHUB_STEP_SUMMARY"
